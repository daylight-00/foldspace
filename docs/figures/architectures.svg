<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 638" width="880" height="638" role="img" aria-label="The two architectures: RFD4 latent adaptation and ESMFold2 latent generation, each with its training targets and its generation path">
<style>
text { font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif; fill: #262626; }
.t { font-size: 13px; } .tm { fill: #5B6068; font-size: 12px; }
.th { font-size: 12px; font-weight: 700; }
.bt { font-size: 13px; font-weight: 700; } .bs { fill: #5B6068; font-size: 10.5px; }
.box { fill: #FFFFFF; stroke: #A3A9B3; stroke-width: 1.2; }
.box.dec { fill: #E7E2F6; stroke: #8678C8; } .box.gen { fill: #FBEEC4; stroke: #D1A53B; }
.arrow, .path { fill: none; stroke: #5F6672; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.mk { fill: #5F6672; }
.bypass { fill: none; stroke: #8E95A1; stroke-width: 1.5; stroke-dasharray: 1 5; stroke-linecap: round; stroke-linejoin: round; }
.title { font-size: 14px; font-weight: 700; }
.legend { fill: #5B6068; font-size: 12px; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M1 1.2 L9 5 L1 8.8 Z" class="mk"/></marker></defs>
<rect width="880" height="638" fill="#FFFFFF"/>
<text x="10" y="22" class="title">A   RFD4 latent adaptation</text>
<g transform="translate(0 34)"><text x="10.0" y="18.0" class="th" text-anchor="start">Training: natural chains give the targets</text><rect x="10" y="30" width="126" height="64" rx="3" class="box"/><text x="73.0" y="54.0" class="bt" text-anchor="middle">natural chain</text><text x="73.0" y="71.0" class="bs" text-anchor="middle">sequence and</text><text x="73.0" y="84.0" class="bs" text-anchor="middle">structure</text><rect x="158" y="30" width="126" height="64" rx="3" class="box"/><text x="221.0" y="54.0" class="bt" text-anchor="middle">ESMC (frozen)</text><text x="221.0" y="71.0" class="bs" text-anchor="middle">last hidden state,</text><text x="221.0" y="84.0" class="bs" text-anchor="middle">2,560 channels</text><line x1="137" y1="62.0" x2="157" y2="62.0" class="arrow" marker-end="url(#ah)"/><rect x="306" y="30" width="126" height="64" rx="3" class="box dec"/><text x="369.0" y="54.0" class="bt" text-anchor="middle">latent map</text><text x="369.0" y="71.0" class="bs" text-anchor="middle">to 32 channels,</text><text x="369.0" y="84.0" class="bs" text-anchor="middle">trained with decoder</text><line x1="285" y1="62.0" x2="305" y2="62.0" class="arrow" marker-end="url(#ah)"/><rect x="454" y="30" width="126" height="64" rx="3" class="box"/><text x="517.0" y="54.0" class="bt" text-anchor="middle">targets</text><text x="517.0" y="71.0" class="bs" text-anchor="middle">true Cα and z;</text><text x="517.0" y="84.0" class="bs" text-anchor="middle">z ± native channels</text><line x1="433" y1="62.0" x2="453" y2="62.0" class="arrow" marker-end="url(#ah)"/><text x="10.0" y="136.0" class="th" text-anchor="start">Generation</text><rect x="10" y="148" width="126" height="64" rx="3" class="box"/><text x="73.0" y="172.0" class="bt" text-anchor="middle">noise</text><text x="73.0" y="189.0" class="bs" text-anchor="middle">length L</text><text x="73.0" y="202.0" class="bs" text-anchor="middle"></text><rect x="158" y="148" width="126" height="64" rx="3" class="box gen"/><text x="221.0" y="172.0" class="bt" text-anchor="middle">adapted flow</text><text x="221.0" y="189.0" class="bs" text-anchor="middle">pretrained, then</text><text x="221.0" y="202.0" class="bs" text-anchor="middle">continued on z</text><line x1="137" y1="180.0" x2="157" y2="180.0" class="arrow" marker-end="url(#ah)"/><rect x="306" y="148" width="126" height="64" rx="3" class="box"/><text x="369.0" y="172.0" class="bt" text-anchor="middle">Cα trace, z</text><text x="369.0" y="189.0" class="bs" text-anchor="middle">generated together</text><text x="369.0" y="202.0" class="bs" text-anchor="middle"></text><line x1="285" y1="180.0" x2="305" y2="180.0" class="arrow" marker-end="url(#ah)"/><rect x="454" y="148" width="126" height="64" rx="3" class="box dec"/><text x="517.0" y="172.0" class="bt" text-anchor="middle">decoder</text><text x="517.0" y="189.0" class="bs" text-anchor="middle">adapted copy of</text><text x="517.0" y="202.0" class="bs" text-anchor="middle">the release decoder</text><line x1="433" y1="180.0" x2="453" y2="180.0" class="arrow" marker-end="url(#ah)"/><rect x="602" y="148" width="126" height="64" rx="3" class="box"/><text x="665.0" y="172.0" class="bt" text-anchor="middle">structure</text><text x="665.0" y="189.0" class="bs" text-anchor="middle">all atoms and</text><text x="665.0" y="202.0" class="bs" text-anchor="middle">sequence</text><line x1="581" y1="180.0" x2="601" y2="180.0" class="arrow" marker-end="url(#ah)"/><path d="M517.0 95 V116" class="bypass"/><path d="M517.0 116 H221.0 V147" class="bypass" marker-end="url(#ah)"/><text x="369.0" y="110.0" class="tm" text-anchor="middle">the flow learns to generate (true Cα, z)</text><path d="M517.0 116 H517.0 V147" class="bypass" marker-end="url(#ah)"/><text x="525.0" y="132.0" class="tm" text-anchor="start">the decoder learns to read (true Cα, z)</text></g>
<text x="10" y="316" class="title">B   ESMFold2 latent generation</text>
<g transform="translate(0 328)"><text x="10.0" y="18.0" class="th" text-anchor="start">Training: natural chains give the targets</text><rect x="10" y="30" width="126" height="64" rx="3" class="box"/><text x="73.0" y="54.0" class="bt" text-anchor="middle">natural chain</text><text x="73.0" y="71.0" class="bs" text-anchor="middle">sequence</text><text x="73.0" y="84.0" class="bs" text-anchor="middle"></text><rect x="158" y="30" width="126" height="64" rx="3" class="box"/><text x="221.0" y="54.0" class="bt" text-anchor="middle">ESMC (frozen)</text><text x="221.0" y="71.0" class="bs" text-anchor="middle">inside the ESMFold2</text><text x="221.0" y="84.0" class="bs" text-anchor="middle">checkpoint</text><line x1="137" y1="62.0" x2="157" y2="62.0" class="arrow" marker-end="url(#ah)"/><rect x="306" y="30" width="126" height="64" rx="3" class="box"/><text x="369.0" y="54.0" class="bt" text-anchor="middle">mixed single</text><text x="369.0" y="71.0" class="bs" text-anchor="middle">H(S), 256 channels</text><text x="369.0" y="84.0" class="bs" text-anchor="middle">per residue</text><line x1="285" y1="62.0" x2="305" y2="62.0" class="arrow" marker-end="url(#ah)"/><text x="10.0" y="136.0" class="th" text-anchor="start">Generation</text><rect x="10" y="148" width="126" height="64" rx="3" class="box"/><text x="73.0" y="172.0" class="bt" text-anchor="middle">noise</text><text x="73.0" y="189.0" class="bs" text-anchor="middle">length L</text><text x="73.0" y="202.0" class="bs" text-anchor="middle"></text><rect x="158" y="148" width="126" height="64" rx="3" class="box gen"/><text x="221.0" y="172.0" class="bt" text-anchor="middle">generator</text><text x="221.0" y="189.0" class="bs" text-anchor="middle">from scratch,</text><text x="221.0" y="202.0" class="bs" text-anchor="middle">flow matching</text><line x1="137" y1="180.0" x2="157" y2="180.0" class="arrow" marker-end="url(#ah)"/><rect x="306" y="148" width="126" height="64" rx="3" class="box"/><text x="369.0" y="172.0" class="bt" text-anchor="middle">Ĥ</text><text x="369.0" y="189.0" class="bs" text-anchor="middle">256 channels</text><text x="369.0" y="202.0" class="bs" text-anchor="middle">per residue</text><line x1="285" y1="180.0" x2="305" y2="180.0" class="arrow" marker-end="url(#ah)"/><rect x="454" y="148" width="126" height="64" rx="3" class="box dec"/><text x="517.0" y="172.0" class="bt" text-anchor="middle">sequence head</text><text x="517.0" y="189.0" class="bs" text-anchor="middle">reads types off Ĥ,</text><text x="517.0" y="202.0" class="bs" text-anchor="middle">gives Ŝ</text><line x1="433" y1="180.0" x2="453" y2="180.0" class="arrow" marker-end="url(#ah)"/><rect x="602" y="148" width="126" height="64" rx="3" class="box"/><text x="665.0" y="172.0" class="bt" text-anchor="middle">ESMFold2</text><text x="665.0" y="189.0" class="bs" text-anchor="middle">frozen; folds</text><text x="665.0" y="202.0" class="bs" text-anchor="middle">(Ŝ, Ĥ)</text><line x1="581" y1="180.0" x2="601" y2="180.0" class="arrow" marker-end="url(#ah)"/><rect x="750" y="148" width="126" height="64" rx="3" class="box"/><text x="813.0" y="172.0" class="bt" text-anchor="middle">structure</text><text x="813.0" y="189.0" class="bs" text-anchor="middle">no separate Cα</text><text x="813.0" y="202.0" class="bs" text-anchor="middle">generation</text><line x1="729" y1="180.0" x2="749" y2="180.0" class="arrow" marker-end="url(#ah)"/><path d="M369.0 95 V116" class="bypass"/><path d="M369.0 116 H221.0 V147" class="bypass" marker-end="url(#ah)"/><text x="295.0" y="110.0" class="tm" text-anchor="middle">the generator learns H</text><path d="M369.0 116 H517.0 V147" class="bypass" marker-end="url(#ah)"/><text x="525.0" y="132.0" class="tm" text-anchor="start">the head learns S from H</text><path d="M369.0 213 V238 H665.0 V214" class="path" marker-end="url(#ah)"/><text x="517.0" y="256.0" class="tm" text-anchor="middle">Ĥ also enters the frozen model, as a pair bias</text></g>
<text x="10" y="626" class="legend">Purple: reads a representation. Yellow: generates one. Solid arrows: data path. Dotted arrows: supervised by the natural-chain targets.</text>
</svg>
